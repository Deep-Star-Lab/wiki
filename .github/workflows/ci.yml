name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  # "Bu ay" / "Son 90 gün" liderlik sekmelerinin ay dönümünde güncellenmesi için günlük derleme
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip

      - run: pip install -r requirements.txt
      # Organizasyon depolarını çek (hata olursa derleme yine de devam eder)
      - run: python scripts/fetch_repos.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python tests/test_dsl.py
      - run: python tests/test_content.py
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
