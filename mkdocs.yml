site_name: Deep Star Lab
site_description: Deep Star Lab Wiki
site_url: https://Deep-Star-Lab.github.io/wiki
repo_url: https://github.com/Deep-Star-Lab/wiki
repo_name: Deep-Star-Lab/wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: tr
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Aydınlık moda geç
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Karanlık moda geç
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

# Yazar standardı + liderlik tablosu (data/ klasöründen beslenir)
hooks:
  - hooks/dsl.py

# --- Çok dilli yapı (TR varsayılan, EN alternatif) ---
# Dosya isimlendirme: sayfa.md -> Türkçe, sayfa.en.md -> İngilizce
plugins:
  - search:
      separator: '[\s\u200b\-]'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: tr
          name: Türkçe
          build: true
          default: true
        - locale: en
          name: English
          build: true
          site_description: Deep Star Lab Wiki
          nav_translations:
            Ana Sayfa: Home
            Başlarken: Getting Started
            Kuruluma Genel Bakış: Setup Overview
            Katkı Rehberi: Contributing Guide
            Projeler: Projects
            Genel Bakış: Overview
            Kaynaklar: Resources
            Öğrenme Kaynakları: Learning Resources
            Bitnet Transform Türkçe Rehber: BitNet 1.58-bit Fine-tuning (Turkish translation)
            Türkçe Morfolojik Tokenizer: Turkish Morphological Tokenizer
            Ternary Backward Mekanizması: Ternary Backward Mechanism
            Talimat Veri Seti: Instruction Dataset
            Depolar: Repositories
            Sözlük: Glossary
            Topluluk: Community
            Kurallar: Rules
            Liderlik Tablosu: Leaderboard
            SSS: FAQ
          theme:
            palette:
              - scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: Switch to light mode
              - scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: Switch to dark mode

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Deep-Star-Lab/wiki
    - icon: fontawesome/brands/discord
      link: https://github.com/Deep-Star-Lab/wiki

nav:
  - Ana Sayfa: index.md
  - Başlarken:
      - Kuruluma Genel Bakış: getting-started/overview.md
      - Katkı Rehberi: getting-started/contributing.md
  - Projeler:
      - Genel Bakış: projects/index.md
      - Türkçe Morfolojik Tokenizer: projects/turkish-tokenizer.md
      - Ternary Backward Mekanizması: projects/ternary-backward.md
      - Talimat Veri Seti: projects/instruction-dataset.md
  - Depolar: repos.md
  - Kaynaklar:
      - Öğrenme Kaynakları: resources/learning.md
      - Sözlük: resources/glossary.md
      - Bitnet Transform Türkçe Rehber: resources/q.md
  - Topluluk:
      - Kurallar: rules.md
      - Liderlik Tablosu: leaderboard.md
  - SSS: faq.md
