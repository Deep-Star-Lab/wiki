# Okuma listesi — ŞİMDİLİK ÖRNEK VERİ
# ------------------------------------------------------------------
# Bu liste yerleşim ve alanları göstermek için hazırlandı; topluluk önerileriyle değişecek.
# Öneri eklemek için PR aç:
#   title    : makale başlığı
#   authors  : kısa yazar bilgisi ("Vaswani et al.")
#   year     : yıl
#   url      : https bağlantısı (arXiv/DOI/HF)
#   topic    : aşağıdaki `topics` anahtarlarından biri
#   level    : beginner | intermediate | advanced
#   why      : {tr, en} neden okunmalı? (tek cümle)
#   suggested_by : (opsiyonel) [kişi id'leri]  (data/authors.yml)
# ------------------------------------------------------------------
topics:
  architecture: {tr: Mimari, en: Architecture}
  quantization: {tr: Kuantizasyon, en: Quantization}
  tokenizer: {tr: Tokenizer, en: Tokenizer}
  instruction: {tr: Talimat Eğitimi ve Veri, en: Instruction Tuning and Data}
  training: {tr: Eğitim, en: Training}

items:
  - title: "Attention Is All You Need"
    authors: Vaswani et al.
    year: 2017
    url: https://arxiv.org/abs/1706.03762
    topic: architecture
    level: intermediate
    why:
      tr: Transformatör mimarisinin kaynağı; bu listedeki hemen her şeyin temeli.
      en: The origin of the transformer architecture; the basis of nearly everything on this list.
  - title: "BitNet: Scaling 1-bit Transformers for Large Language Models"
    authors: Wang et al.
    year: 2023
    url: https://arxiv.org/abs/2310.11453
    topic: quantization
    level: intermediate
    why:
      tr: BitLinear katmanını ve 1 bitlik transformatör fikrini tanıtır.
      en: Introduces the BitLinear layer and the 1-bit transformer idea.
  - title: "The Era of 1-bit LLMs: All Large Language Models are in 1.58 Bits"
    authors: Ma et al.
    year: 2024
    url: https://arxiv.org/abs/2402.17764
    topic: quantization
    level: intermediate
    why:
      tr: Üçlü (-1, 0, 1) ağırlıklı BitNet b1.58'i anlatır; wiki'deki çevirinin dayanağı.
      en: Describes BitNet b1.58 with ternary (-1, 0, 1) weights; the basis of the translation in this wiki.
  - title: "Estimating or Propagating Gradients Through Stochastic Neurons for Conditional Computation"
    authors: Bengio et al.
    year: 2013
    url: https://arxiv.org/abs/1308.3432
    topic: quantization
    level: advanced
    why:
      tr: Düz Geçiş Tahmincisi (STE) fikrinin klasik kaynağı.
      en: The classic source of the straight-through estimator (STE) idea.
  - title: "QLoRA: Efficient Finetuning of Quantized LLMs"
    authors: Dettmers et al.
    year: 2023
    url: https://arxiv.org/abs/2305.14314
    topic: quantization
    level: intermediate
    why:
      tr: Kuantize edilmiş bir modeli sınırlı donanımda ince ayarlamanın pratik yolu.
      en: A practical way to fine-tune a quantized model on limited hardware.
  - title: "LoRA: Low-Rank Adaptation of Large Language Models"
    authors: Hu et al.
    year: 2021
    url: https://arxiv.org/abs/2106.09685
    topic: training
    level: beginner
    why:
      tr: Az sayıda parametreyle verimli ince ayarın temel tekniği.
      en: The core technique for efficient fine-tuning with few trainable parameters.
  - title: "Training Compute-Optimal Large Language Models"
    authors: Hoffmann et al.
    year: 2022
    url: https://arxiv.org/abs/2203.15556
    topic: training
    level: intermediate
    why:
      tr: Model boyutu ile veri miktarı arasındaki dengeyi gösteren ölçekleme çalışması.
      en: The scaling study showing the balance between model size and data.
  - title: "Neural Machine Translation of Rare Words with Subword Units"
    authors: Sennrich et al.
    year: 2015
    url: https://arxiv.org/abs/1508.07909
    topic: tokenizer
    level: beginner
    why:
      tr: BPE ile alt sözcük tokenizasyonunun giriş noktası.
      en: The entry point to subword tokenization with BPE.
  - title: "SentencePiece: A simple and language independent subword tokenizer and detokenizer"
    authors: Kudo & Richardson
    year: 2018
    url: https://arxiv.org/abs/1808.06226
    topic: tokenizer
    level: intermediate
    why:
      tr: Dilden bağımsız tokenizer'ların nasıl kurulduğunu gösterir; Türkçe tokenizer projesi için referans.
      en: Shows how language-independent tokenizers are built; a reference for the Turkish tokenizer project.
  - title: "Finetuned Language Models Are Zero-Shot Learners (FLAN)"
    authors: Wei et al.
    year: 2021
    url: https://arxiv.org/abs/2109.01652
    topic: instruction
    level: intermediate
    why:
      tr: Talimat eğitiminin genelleme gücünü gösteren çalışma.
      en: Shows the generalization power of instruction tuning.
  - title: "Training language models to follow instructions with human feedback"
    authors: Ouyang et al.
    year: 2022
    url: https://arxiv.org/abs/2203.02155
    topic: instruction
    level: intermediate
    why:
      tr: InstructGPT; talimat izleyen modellerin klasik tarifi.
      en: InstructGPT; the classic recipe for instruction-following models.
  - title: "LIMA: Less Is More for Alignment"
    authors: Zhou et al.
    year: 2023
    url: https://arxiv.org/abs/2305.11206
    topic: instruction
    level: beginner
    why:
      tr: Talimat verisinde miktardan çok kalitenin önemini savunur; veri seti projesi için ilham.
      en: Argues quality matters more than quantity in instruction data; inspiration for the dataset project.
